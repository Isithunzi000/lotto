name: Aktualizacja wyników losowań

# Pobiera brakujące wyniki z oficjalnego LOTTO OpenAPI i commituje
# zaktualizowaną bazę (blob w index.html). Klucz API siedzi wyłącznie
# w sekrecie repo — nigdy nie trafia do plików ani logów.
#
# Harmonogram: losowania wieczorne kończą się 22:00 czasu Warszawy.
# Dwa wpisy cron pokrywają czas letni (CEST = UTC+2) i zimowy (CET = UTC+1):
#   21:35 UTC = 23:35 CEST / 22:35 CET
#   22:35 UTC = 00:35 CEST / 23:35 CET
# Skrypt jest idempotentny — run bez nowych wyników kończy się bez commitu.

on:
  schedule:
    - cron: '35 21 * * *'
    - cron: '35 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pobierz brakujące wyniki z LOTTO OpenAPI
        id: fetch
        env:
          LOTTO_API_KEY: ${{ secrets.LOTTO_API_KEY }}
        run: python3 tools/update_draws.py

      - name: Commit zaktualizowanej bazy
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "data: wyniki do ${{ steps.fetch.outputs.through }}"
          git push

      - name: Brak nowych wyników
        if: steps.fetch.outputs.changed == 'false'
        run: echo "Baza aktualna — bez commitu."
