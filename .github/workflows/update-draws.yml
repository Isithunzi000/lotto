name: Sonda wyników LOTTO

# Sondowanie oficjalnego LOTTO OpenAPI (developers.lotto.pl, spec: openapi.json)
# i aktualizacja repo:
#   1. dopiski nowych losowań do data/*.csv (append-only, walidowane)
#   2. nadpis data/kumulacje.csv (Lotto i Eurojackpot — jedyne gry kumulacyjne wg spec)
#   3. przebudowa bloba danych w index.html z CSV (kalkulator na Pages jest świeży)
# Klucz API siedzi wyłącznie w sekrecie repo — nigdy nie trafia do plików ani logów.
#
# Harmonogram (UTC) — losowania trzymają stałą godzinę lokalną (Warszawa):
#   MM 14:00, Eurojackpot 20:15 (wt/pt), reszta 22:00.
# Cron jest w UTC, a losowania w czasie lokalnym — dla każdego celu są więc
# DWA crony (para sezonowa): jeden trafiony latem, drugi zimą. Run „poza
# sezonem" ląduje przed losowaniem i kończy się pusto — skrypt jest
# idempotentny, więc to koszt ~30 s runnera bez commitu.
#   MM 14:00:       12:35 UTC = 14:35 CEST (lato)  | 13:35 UTC = 14:35 CET (zima)
#   EJ 20:15 wt/pt: 19:15 UTC = 21:15 CEST (lato)  | 20:15 UTC = 21:15 CET (zima)  (+60 min — EJ publikuje wolno)
#   Blok 22:00:     20:45 UTC = 22:45 CEST (lato)  | 21:35 UTC = 22:35 CET (zima)  (+45/+35 min — bufor publikacji)
#   Zapas:          22:35 UTC = 00:35 CEST / 23:35 CET (opóźniona publikacja)
#   Wyciągarka:     06:15 UTC = 08:15 CEST / 07:15 CET (domyka wszystko, co umknęło w nocy)
# Minuty poza :00/:30 (korki crona GitHuba); odstępy między runami >= 30 min,
# żeby grupa współbieżności nie kolejkowała runów w nieskończoność.
# Skrypt jest idempotentny — sonda bez nowych danych kończy się bez commitu,
# a luka (np. tydzień przestoju) jest uzupełniana dzień po dniu przy najbliższym runie.

on:
  schedule:
    - cron: '35 12 * * *'
    - cron: '35 13 * * *'
    - cron: '15 19 * * 2,5'
    - cron: '15 20 * * 2,5'
    - cron: '45 20 * * *'
    - cron: '35 21 * * *'
    - cron: '35 22 * * *'
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commit + push danych
  issues: write     # issue przy porażce sekcji opcjonalnych

# HARDENING: jeden run naraz. Opóźniony cron (GitHub bywa spóźniony o 1-2 h)
# może się złożyć z kolejnym — bez tej grupy dwa runy ścigały się o push
# i przegrywający dostawał non-fast-forward. cancel-in-progress: false
# = kolejny run CZEKA w kolejce zamiast ubijać bieżący (dane i tak dogoni,
# bo skrypt uzupełnia luki).
concurrency:
  group: sonda-lotto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # zdrowy run trwa <1 min; 15 min = dead-man switch
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sondowanie LOTTO OpenAPI i aktualizacja CSV + bloba
        id: fetch
        env:
          LOTTO_API_KEY: ${{ secrets.LOTTO_API_KEY }}
        # HARDENING: jedna automatyczna ponówka po 60 s. Skrypt ma własne
        # retry HTTP per zapytanie, ale przejściowa awaria API/runnera
        # nie powinna od razu wysyłać maila o porażce. Skrypt jest
        # idempotentny — drugie odpalenie jest bezpieczne.
        run: |
          if ! python3 tools/update_draws.py; then
            echo "::warning::sonda nie powiodła się — ponawiam za 60 s"
            sleep 60
            python3 tools/update_draws.py
          fi

      - name: Commit i push zaktualizowanych danych
        if: steps.fetch.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.fetch.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html

          # HARDENING: guard na pusty staging — "nothing to commit" (exit 1)
          # nie jest błędem wartym czerwonego krzyżyka.
          if git diff --cached --quiet; then
            echo "Skrypt zgłosił zmiany, ale staging jest pusty — pomijam commit."
            exit 0
          fi

          git commit -m "$SUMMARY"

          # HARDENING: push odporny na przejściowe problemy i wyścigi:
          # pull --rebase wyrównuje z main (gdyby inny run zdążył wypchnąć),
          # a pętla robi do 3 prób z rosnącą pauzą. Dopiero potrójna porażka
          # kończy run błędem.
          ok=""
          for i in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
            fi
            if git push; then
              ok=1
              break
            fi
            echo "::warning::push: próba $i nieudana — ponawiam za $((i * 15)) s"
            sleep $((i * 15))
          done
          if [ -z "$ok" ]; then
            echo "::error::push nie powiódł się po 3 próbach — dane zostaną dograne przy następnym runie"
            exit 1
          fi

      - name: Brak nowych danych
        if: steps.fetch.outputs.changed == 'false'
        run: echo "Wszystko aktualne — bez commitu."

      # Sekcje opcjonalne (wypłaty/mediany/sprzedaż) nie blokują sondy — skrypt
      # kończy się zielono, ale zgłasza optfail=true. Tutaj zamieniamy to na
      # issue (jedno otwarte naraz; kolejne występy lądują jako komentarze),
      # żeby sygnał nie ginął w logach.
      - name: Zgłoś błędy sekcji opcjonalnych (issue)
        if: steps.fetch.outputs.optfail == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECTIONS: ${{ steps.fetch.outputs.optfail_sections }}
        run: |
          SEARCH="Sonda: błąd sekcji opcjonalnej in:title"
          NUM=$(gh issue list --state open --search "$SEARCH" --json number --jq '.[0].number')
          BODY="Sekcje: $SECTIONS — dane główne (losowania, kumulacje, blob) zapisały się poprawnie, to NIE blokuje sondy. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$NUM" ]; then
            gh issue create --title "Sonda: błąd sekcji opcjonalnej ($(date +%Y-%m-%d))" --body "$BODY"
          else
            gh issue comment "$NUM" --body "Kolejny przypadek $(date +%Y-%m-%d\ %H:%M\ UTC): $BODY"
          fi
