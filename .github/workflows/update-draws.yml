name: Sonda wyników LOTTO

# Sondowanie oficjalnego LOTTO OpenAPI (developers.lotto.pl, spec: openapi.json)
# i aktualizacja repo:
#   1. dopiski nowych losowań do data/*.csv (append-only, walidowane)
#   2. nadpis data/kumulacje.csv (Lotto i Eurojackpot — jedyne gry kumulacyjne wg spec)
#   3. przebudowa bloba danych w index.html z CSV (kalkulator na Pages jest świeży)
# Klucz API siedzi wyłącznie w sekrecie repo — nigdy nie trafia do plików ani logów.
#
# Harmonogram (UTC) — losowania trzymają stałą godzinę lokalną (Warszawa):
#   MM 14:00, Eurojackpot 20:15, reszta 22:00.
#   13:35 UTC = 15:35 CEST / 14:35 CET  -> po MM 14:00
#   21:35 UTC = 23:35 CEST / 22:35 CET  -> po losowaniach 22:00
#   22:35 UTC = 00:35 CEST / 23:35 CET  -> zapasowa (opóźniona publikacja)
# Skrypt jest idempotentny — sonda bez nowych danych kończy się bez commitu,
# a luka (np. tydzień przestoju) jest uzupełniana dzień po dniu przy najbliższym runie.

on:
  schedule:
    - cron: '35 13 * * *'
    - cron: '35 21 * * *'
    - cron: '35 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sondowanie LOTTO OpenAPI i aktualizacja CSV + bloba
        id: fetch
        env:
          LOTTO_API_KEY: ${{ secrets.LOTTO_API_KEY }}
        run: python3 tools/update_draws.py

      - name: Commit zaktualizowanych danych
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git commit -m "${{ steps.fetch.outputs.summary }}"
          git push

      - name: Brak nowych danych
        if: steps.fetch.outputs.changed == 'false'
        run: echo "Wszystko aktualne — bez commitu."
