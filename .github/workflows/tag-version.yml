name: Tag wersji

# Lekki tag git przy każdej zmianie numeru wersji w index.html + GitHub
# Release dla nowego taga (notatka = komunikat commita wersji).
# Sonda danych też dotyka index.html, ale bez zmiany wersji — wtedy tag
# już istnieje i workflow kończy się no-op (release też jest pomijany).

on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:

permissions:
  contents: write

# HARDENING: jeden run naraz. Sonda wypycha index.html 3x dziennie,
# a rekalibracja dodatkowo raz na pół roku — bez grupy dwa runy mogłyby
# ścigać się o utworzenie tego samego taga (przegrywający = czerwony run).
# cancel-in-progress: false = kolejny run czeka i robi no-op, gdy tag
# w międzyczasie powstał.
concurrency:
  group: tag-version
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Utwórz tag z version-tag w index.html
        id: tag
        run: |
          # Szukamy numeru w HTML-owym divie (version-tag">vX.Y.Z), nie w regułach CSS.
          V=$(grep -m1 -oE 'version-tag">v[0-9]+\.[0-9]+\.[0-9]+' index.html | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$V" ]; then echo "nie znaleziono numeru wersji"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            echo "tag $V już istnieje — pomijam"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$V"
          # HARDENING: push taga z retry (przejściowe błędy sieci) i re-checkiem
          # zdalnego taga — jak tag już jest na origin, to no-op, nie błąd.
          ok=""
          for i in 1 2 3; do
            if git push origin "$V"; then
              ok=1
              break
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null 2>&1; then
              echo "tag $V już jest na origin — traktuję jako no-op"
              ok=1
              break
            fi
            echo "::warning::push taga: próba $i nieudana — ponawiam za $((i * 10)) s"
            sleep $((i * 10))
          done
          if [ -z "$ok" ]; then
            echo "::error::push taga $V nie powiódł się po 3 próbach"
            exit 1
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "utworzono tag $V"
      - name: Utwórz GitHub Release z notatką z commita wersji (idempotentnie)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.tag.outputs.version }}
        run: |
          # HARDENING: krok NIE zależy od flagi created — gdy poprzedni run
          # wypchnął tag, ale padł na tworzeniu release, ten krok i tak go
          # domknie. Istniejący release = no-op. Notatkę bierzemy z commita
          # TAGA (nie z HEAD — przy domykającym runie HEAD to już inny commit).
          if gh release view "$V" >/dev/null 2>&1; then
            echo "release $V już istnieje — pomijam"
            exit 0
          fi
          ok=""
          for i in 1 2 3; do
            if gh release create "$V" --title "$V" --notes "$(git log -1 --format=%B "$V")"; then
              ok=1
              break
            fi
            echo "::warning::release $V: próba $i nieudana — ponawiam za $((i * 10)) s"
            sleep $((i * 10))
          done
          if [ -z "$ok" ]; then
            # re-check: release mógł powstać mimo błędnej odpowiedzi (timeout po zapisie)
            if gh release view "$V" >/dev/null 2>&1; then
              echo "release $V istnieje mimo błędu odpowiedzi — traktuję jako OK"
              exit 0
            fi
            echo "::error::release $V nie powiódł się po 3 próbach"
            exit 1
          fi
          echo "utworzono release $V"
